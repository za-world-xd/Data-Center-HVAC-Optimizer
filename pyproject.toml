[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-cooltwin"
version = "0.0.5"
description = "Lumped data center cooling simulation and constrained setpoint planning"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pydantic>=2.10,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "streamlit>=1.41,<2", "plotly>=5.24,<7", "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
browser = ["playwright>=1.49,<2"]

[tool.setuptools.packages.find]
include = ["engine*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4"]
